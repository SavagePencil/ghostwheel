# =============================================================================
# METAONTOLOGY — the engine's own ontology (kernel + common facet library)
# =============================================================================
# VERSIONING (owner rule, the self-description round): semver, bumped WHENEVER this file
# changes — MAJOR: a name removed/renamed or semantics changed;
# MINOR: additive (new root, facet, concept, key); PATCH: wording/docs
# only. Every change appends (version, fingerprint) to
# graph/schema-versions.txt — a test enforces both.
# 0.x.x is the development era: breaking changes are allowed and
# MINOR may break (semver's own 0.x convention). 1.0.0 means STABLE and
# only the owner declares it — the canon flip does NOT imply it; the
# schema stays 0.x through campaign and refactor churn until stability
# is a promise worth making.
#
# This file belongs to the ENGINE, not to any one project. It is loaded first;
# the project's graph/ontology.yaml is layered on top and may reference
# everything declared here (e.g. `instance_of: Concept`). Projects may NOT
# redeclare kernel names.
#
# The kernel is deliberately tiny — four things across three kinds:
#   - one label:    Archetype   (what every metamodel node IS)
#   - one relation: INSTANCE_OF (how anything points at its archetype)
#   - four roots:   declared below
# Everything else — domain categories, project facets, labels — is DERIVED
# through intake, project by project. The metaontology stays fluid: entries
# arrive here when artifacts (or design dialogues) demand them.
#
# Doc strings below become queryable `doc` properties on the Archetype nodes.
#
# MACHINERY MARKING (owner ruling, widened at the bracket sweep):
# citizens the owner designates as machinery — vocabulary customers
# interrogate but never say — wear square brackets in their NAME:
# '[Segment Scheme]', '[Schema Layer]' (vim-special-buffer prior art: in
# your list, not yours to touch). Brackets ALSO keep the kernel from
# shadowing a word a designer's world might need: a story has its own
# artifacts, questions, decisions, answers, steps and outcomes, so the
# kernel's are '[Artifact]', '[Question]', '[Decision]', '[Answer]',
# '[Step]', '[Outcome]' and so on. Exempt: the four roots and the facets
# (never a citizen's label — Archetype-row vocabulary only; awaits the
# first world whose subject matter needs one of those words), the
# Metaontology/Ontology anchors (engine-stamped), and Theme — designer
# lexicon, the owner's word, kept unbracketed on purpose. Designating
# more is one bracket-wrap + a MINOR bump. Filter for relevance:
#   WHERE NOT a.name STARTS WITH '['
#
# --- Reserved vocabulary (documented before it exists) -----------------------
# Under Judgment:   [Question] / [Decision] / [Answer] / [TODO] /
#                   [Approved Omission] / [Requirement] / [Opinion] /
#                   [Interpretation] are KERNEL
#                   concepts (declared below; promoted from project
#                   labels at the self-description round — the storybook
#                   test: every corpus with gates has them). Projects bind
#                   labels + tables to them (a project's own question
#                   tables, etc.).
#                   Reserved: Inconsistency (assertion vs. the world's rules,
#                   e.g. a character speaks after dying), Contradiction
#                   (source vs. source).
# Under Provenance: Artifact and DocSection are project-level labels
#                   (declared in a project's ontology, bound to this root),
#                   with MENTIONS / PART_OF edges; SPECIFIED_IN reserved.
#                   [Knowledge Base Dependency] and [Citizen Bookmark] are kernel machinery here
#                   (bracketed: a designer never authors either as subject
#                   matter): a [Knowledge Base Dependency] is another knowledge base this
#                   one pins at an edition; a [Citizen Bookmark] is a citizen that
#                   lives in a dependency, cited from here. Any knowledge
#                   base holding [Knowledge Base Dependency] entries is playing the world
#                   role — a role, never a type. [Artifact] is the thing a
#                   person hands over, promoted from the project level at
#                   the bracket sweep: identity is its name, WHERE it is
#                   lives on [Artifact Location] rows behind LOCATED_AT
#                   ([File Location] the kernel's own kind; other kinds by
#                   the owning world's taxonomy ceremony), and a [Resolver]
#                   binds a location kind to the procedure that opens it
#                   (OPENS_WITH). [Pocket Universe] is a branch's
#                   own declaration of itself as a pocket (who cut it,
#                   when, who may look, the base kind, the canon identity
#                   it forked from): engine-written at the cut and by the
#                   invite verbs, never authored, set aside from content
#                   identity, stripped at succession.
# Relations:        SUBTYPE_OF (genuine taxonomy — never use for the
#                   instance tower; declared via `subtypes:` on a concept
#                   entry naming the citizens that are its KINDS, derived
#                   at every rebuild, never authored; first activated at
#                   a project's kernel ceremony). DECLARED_MEMBER_OF (the
#                   declared-membership pattern): an AUTHORED ground edge, a
#                   citizen -> a Concept-rooted Archetype, carrying a
#                   required `basis` rationale — the one metamodel-touching
#                   edge a designer may write by hand. It says "this one
#                   citizen is ALSO an instance of that concept" (the golden
#                   key that is a Treasure by its roster and ALSO a Tool),
#                   and derivation FOLDS it into the citizen's INSTANCE_OF at
#                   every rebuild. Distinct from both neighbours: unlike the
#                   never-authored SUBTYPE_OF taxonomy it classifies a single
#                   citizen, not a KIND; unlike the machine-derived
#                   INSTANCE_OF tower it is ground the strip preserves, never
#                   a computed shadow. It only ever ADDS membership — it
#                   never re-homes a citizen (its roster label, catalog, and
#                   source stay its own). TRANSITIONS_TO {trigger} is the
#                   Stateful facet's edge vocabulary. HAS_DISCIPLINE /
#                   HAS_AUDIENCE route Judgment rows to the project's
#                   Discipline / Audience citizens (one system, shared
#                   names). CHECKS (Answer Key -> Procedure): an authored
#                   ground edge naming the program a fidelity check holds
#                   to its approved table. RESOLVES_IN ([Citizen Bookmark] ->
#                   [Knowledge Base Dependency]): an authored ground edge naming the pinned
#                   knowledge base a bookmarked citizen lives in — exactly
#                   one per bookmark. DEPICTS ([Artifact] -> any citizen):
#                   the objective contents, one authored edge per depicted
#                   thing, medium-neutral (a song depicts a horn). LOCATED_AT
#                   ([Artifact] -> [Artifact Location]), SUPERSEDES
#                   ([Artifact] new -> old), INTERPRETED_AS ([Interpretation]
#                   -> what it stands for), DRAWS_ON ([Interpretation] -> a
#                   depicted citizen it uses), OPENS_WITH ([Resolver] -> the
#                   procedure that opens a location kind).
# Engine-stamped:   'Metaontology' and 'Ontology' Archetypes
#                   (under Provenance) carry version + content
#                   fingerprint — the self-description slice;
#                   projects may not declare citizens by these names.
# Deferred:         Objective / Subjective as parents above Provenance and
#                   Judgment — add later if the distinction becomes
#                   load-bearing (reparenting is a one-line edit + rebuild).
# =============================================================================

# Ledger — 0.12.0 (the split ceremony): the kernel now ships from its
# own repository, an agnostic graph engine versioned and released
# independently of any consuming project. No vocabulary change; the
# metaontology simply moves to its own home.
# Ledger — 0.13.0 (the declared-membership pattern): the kernel gains the
# DECLARED_MEMBER_OF relation — an authored ground edge, citizen ->
# Concept-rooted Archetype, folded into INSTANCE_OF at derivation — so a
# designer can declare that one citizen is an instance of several concepts
# at once. Additive vocabulary only; MINOR bump.
# Ledger — 0.14.0 (answer keys enter the kernel): the fidelity net that
# holds a table to its approved program — a transitions ladder walk, a
# thresholds pattern, a recompute of worked examples — was a bootstrap
# declaration living only in a consuming corpus's schema file and run only
# by from-sources validation. It becomes a Judgment citizen, Answer Key,
# with one CHECKS edge to the Procedure it holds still, so the net runs
# from canon: at the delta gate when a round touches the key or the
# checked program's body, and as the DB-free `answer-keys` sweep. The
# engine owns the check, so the engine owns the vocabulary. Additive;
# MINOR bump.
# Ledger — 0.15.0 (dependencies and bookmarks enter the kernel): a
# knowledge base gains the vocabulary to pin another knowledge base and
# to cite a citizen that lives there. [Knowledge Base Dependency] pins another knowledge
# base to an edition (its committed backup's identity hash and event-log
# sequence) with a read or write intent; [Citizen Bookmark] names a citizen in a
# dependency — its knowledge base, label, name, and the edition it was
# resolved against — with one RESOLVES_IN edge to that dependency. Both
# are Provenance-rooted machinery: where a dependency lives on disk is
# settings, never canon, and a knowledge base's own citizens point at a
# bookmark through their own relation vocabulary. The delta gate checks
# their shape; resolution against the dependency's backup is the next
# rung. Additive; MINOR bump.
# Ledger — 0.16.0 (the pocket declares itself): a named branch cut as a
# clone of canon is a pocket — a collaborator's own version of a
# knowledge base, hard-isolated from canon. Its declaration lives in
# the branch's own graph as [Pocket Universe] (who cut it, when, who is invited,
# the base kind, the canon identity and sequence it forked from), so the
# front door can ask "who cut this, who may look" and the backup carries
# the answer with no file beside it. Engine-written at the cut and
# rewritten by the invite verbs, never authored by hand; set aside from
# the line's content identity so an invite change moves no chain;
# stripped at succession, since canon is never a pocket. Physical
# readability is a later rung. Additive; MINOR bump.
# Ledger — 0.17.0 (the bracket sweep and artifacts): this ceremony
# RENAMES. Fifteen kernel citizen labels take brackets — [Procedure],
# [Question], [Decision], [Answer], [TODO], [Approved Omission],
# [Requirement], [Opinion], [Answer Key], [Visibility Group],
# [Visibility Class], [Discipline], [Audience], and the machine labels
# [Step] and [Outcome] — because brackets mark machinery AND never
# shadow a word a designer's world might need; and three names from the
# worlds layer take their full words under the never-trim rule —
# [Knowledge Base Dependency], [Citizen Bookmark], [Pocket Universe]. Theme stays unbracketed:
# "Theme is designer lexicon" (the owner's words). Roots, facets, the
# Completeness ladder, and the anchors are exempt until a world's
# subject matter needs one of those words. The rename is delivered by
# kernel-migrate's rename rule (the `renamed` map below): every citizen
# relabeled, every edge re-pointed, project specs rewritten, the
# attribution ledger rewritten, one chained round per canon with its
# inverse — the migration charter's first data-moving op.
#
# The same ceremony brings artifacts into the kernel: [Artifact]
# (promoted from the project level — a same-named project label is
# adopted and renamed by the same rule; identity stays its name, WHERE
# it is moves to [Artifact Location] rows behind LOCATED_AT, with
# [File Location] the kernel's own kind and other kinds declared by the
# owning world through the taxonomy ceremony; its grade reuses
# Completeness as CONTENT HELD — Cited: name and location; Attested: a
# description and its DEPICTS facts confirmed at the gate; Transcribed:
# region receipts, still parked — while VERIFICATION is the location
# row's own fact, never folded into the grade; `superseded_at` and
# SUPERSEDES mark an artifact retired as an intake ruler), DEPICTS
# (the objective contents), [Interpretation] (what an artifact stands
# for to a world, per intent — a fifth ruled-reading grain beside
# alias, Approved Difference, [Approved Omission], and Verbatim,
# entering as a sibling; the name [Intended Use] is reserved for
# placement if it ever needs a citizen, nothing built), and [Resolver]
# as vocabulary (its verb awaits the first tool knowledge base).
# Derivation now folds a citizen's INSTANCE_OF up its label's
# SUBTYPE_OF chain (the taxonomy-membership rule), DAG-enforced at the
# ceremony. MINOR bump under the 0.x convention; the rename is named
# here plainly.
version: "0.17.1"

# Names this kernel renamed, old -> new. kernel-migrate reads this map:
# a canon carrying a citizen label, an Archetype row, a spec binding, or
# an attribution ref under an old name is rewritten to the new one in
# the migration round; a project label that already uses a new name
# refuses by name. A same-named project label is ADOPTED by the rename
# (its row becomes kernel-declared; its file-era spec retires; extra
# concept bindings survive as declared memberships per citizen).
renamed:
  Procedure: "[Procedure]"
  Question: "[Question]"
  Decision: "[Decision]"
  Answer: "[Answer]"
  TODO: "[TODO]"
  Approved Omission: "[Approved Omission]"
  Requirement: "[Requirement]"
  Opinion: "[Opinion]"
  Answer Key: "[Answer Key]"
  Visibility Group: "[Visibility Group]"
  Visibility Class: "[Visibility Class]"
  Discipline: "[Discipline]"
  Audience: "[Audience]"
  Step: "[Step]"
  Outcome: "[Outcome]"
  Artifact: "[Artifact]"
  "[Dependency]": "[Knowledge Base Dependency]"
  "[Bookmark]": "[Citizen Bookmark]"
  "[Pocket]": "[Pocket Universe]"

roots:
  Concept: >-
    User-level subject matter: what the project's things are about (game,
    story, character, ...). Everything under Concept is domain vocabulary a
    designer or player would recognize.
  Facet: >-
    Structural vocabulary: how a concept's value-space behaves. Machinery,
    deliberately kept out of domain queries.
  Provenance: >-
    Objective knowledge-carriers: artifacts, sources, doc sections — where
    assertions about the domain come from.
  Judgment: >-
    Subjective, adjudicated knowledge: Questions awaiting decisions,
    Decisions (with who/when), candidate Inconsistencies and Contradictions
    awaiting rulings. Supersession expected — judgments flip as evidence
    arrives.

concepts:
  # Engine-provided concepts: mechanized vocabulary lives with its machinery.
  # The engine owns the procedure reader and the Step lift, so Procedure
  # ships here — a peer of the project's own concept categories, itself an
  # instance of Concept.
  "[Procedure]": >-
    A rule-governed happening: preconditions, inputs and outputs,
    evaluations, dice, branches, and effects. Exists for comprehension
    (agents reason about it; code and prose can be generated from it),
    not direct execution. Every Procedure is KNOWN_AT one of the
    Completeness levels (see that facet); its possible Outcomes carry
    plain-English guarantees: read-only, cannot-fail, fails-clean,
    fails-with-side-effects. Only what cannot be derived is authored: inputs
    (required/optional), outcome names and guarantees, completeness.
    Reads, consults, mutates, calls, and outcome effects are derived
    for transcribed procedures.
  "[Question]":
    instance_of: Judgment
    doc: >-
      Something genuinely open, awaiting a ruling. Openness is DERIVED —
      no incoming RESOLVES edge — never flagged. Rows accumulate;
      nothing is deleted: the tables are the rationale record.
  "[Decision]":
    instance_of: Judgment
    doc: >-
      A ruling that WAS made: by whom, when. Supersession is EXPECTED —
      decisions flip as evidence arrives, mechanized via SUPERSEDES.
  "[Answer]":
    instance_of: Judgment
    doc: >-
      A clarification: the truth already existed; the Question dissolves
      rather than being legislated (contrast Decision, which settles
      something genuinely open).
  "[TODO]":
    instance_of: Judgment
    doc: >-
      Known work pending. A Question resolves via a Decision; a TODO
      resolves via work.
  "[Approved Omission]":
    instance_of: Judgment
    doc: >-
      An editorial ruling at the parity gates: this claim of a source is
      deliberately absent from its regeneration and passes forever
      after. The claim-diff judge consults these rows.
  "[Answer Key]":
    instance_of: Judgment
    doc: >-
      A fidelity net between an approved program and an approved table:
      the program's derived facts must equal the table's rows. Three
      kinds — transitions (the program's ladder walk equals the table's
      from/to rows), thresholds (each table row's condition appears
      verbatim in the program's branch case), recompute (each worked
      example's asserted numbers recompute from the approved tables).
      A citizen carries its kind, its table, and the remaining
      declaration as JSON, and one CHECKS edge to the Procedure it holds
      still. The engine re-runs every key at the delta gate when a
      round touches the key or the checked program's body, and on
      demand as the answer-keys sweep; a table that drifts from its
      program is named by the key that caught it.
  "[Knowledge Base Dependency]":
    instance_of: Provenance
    doc: >-
      Another knowledge base this one pins to an edition. The citizen's
      name is that knowledge base's own declared name; it carries the
      edition it is pinned to (the dependency's committed backup
      identity hash and its event-log sequence), the intent this
      knowledge base holds toward it (read, or write when a shared
      activity may land rounds there), and the git ref the edition was
      tagged at — that ref is provenance only. Where the dependency's
      checkout sits on this machine is settings and convention, never
      canon: resolution tries the settings lanes first (the environment
      beats the .env line), then the convention — a sibling directory
      of this knowledge base, named by the pin's optional `checkout`
      word or the dependency's own name, and trusted only after the
      found checkout declares this dependency's kb name (a directory's
      name is never trusted over what its graph says). What the
      checkout is CALLED is machine-independent and may ride the pin;
      where its parent sits never enters canon. A
      knowledge base holding dependency entries is playing the world
      role; a dependency may itself hold dependencies. Machinery, never
      subject matter — hence bracketed.
  "[Citizen Bookmark]":
    instance_of: Provenance
    doc: >-
      A citizen that lives in a dependency, cited from this knowledge
      base: the dependency's name, the citizen's label and name there,
      and the dependency edition it was resolved against, with exactly
      one RESOLVES_IN edge to the [Knowledge Base Dependency] it lives in. This
      knowledge base's own citizens point at a bookmark through their
      own relation vocabulary, authored like any ground edge, so the
      setting's fact can rest on the rulebook's citizen without either
      knowledge base holding the other's rows. Machinery, never subject
      matter — hence bracketed.
  "[Pocket Universe]":
    instance_of: Provenance
    doc: >-
      A branch's own declaration of itself as a pocket — a collaborator's
      version of this knowledge base, cut as a clone of canon and
      hard-isolated from it. The citizen is named for the branch and
      carries who cut it, when, who is invited to look, the base kind,
      and the canon identity and sequence it forked from. The engine
      writes it at the cut and rewrites it when the invite list changes;
      nobody authors it by hand, it is set aside from the line's content
      identity, and succession strips it — canon is never a pocket.
      Machinery, never subject matter — hence bracketed.
  # Visibility vocabulary (kernel ceremony, the visibility lens design,
  # owner-ruled 2026-08-11): mechanized vocabulary lives with its
  # machinery — the engine owns the lens (graph/lens.py). The storybook
  # test passes from both directions: any project needs lenses, and a
  # wholly different project (a node-library permissions model) is
  # expressible without one addition. Ground edge vocabulary admitted by the same
  # ceremony — MEMBER_OF (Visibility Group→Visibility Group),
  # IN_CLASS (element→Visibility Class), ALLOWED / DENIED
  # (Visibility Group→Visibility Class; denies against
  # flat classes only), INCLUDES (knowledge grant-inheritance), MANAGES
  # (delegated administration, enforcement at multi-user) — specs land
  # project-side with their first consumers, per the deferred pattern.
  "[Visibility Group]": >-
    A subject of visibility: who can be granted sight. Individuals are
    size-1 groups; groups nest via MEMBER_OF, and the transitive fold
    of a subject's groups is what a visibility lens compiles from.
    Wearing a subset of one's groups (session activation) and
    subtracting a group are lens operations, never membership edits.
  "[Visibility Class]": >-
    A named set of graph elements that visibility verdicts speak about
    — the only permission-bearing unit. kind is knowledge (assume-deny:
    hidden unless a folded group holds an allow) or masking
    (assume-allow: removed only when a mask names it); postures are
    fixed per kind, never switchable. Elements join by IN_CLASS edges
    or by declared label/type selectors. INCLUDES carries knowledge
    grant-inheritance (holding the child includes the parent);
    hierarchical resource trees model as OVERLAPPING MEMBERSHIPS,
    never as INCLUDES (owner-ruled at the ceremony).
  "[Discipline]":
    instance_of: Judgment
    doc: >-
      A kind of concern — the axis a team splits its thinking along.
      The kernel declares only the class: every project's disciplines
      are its own (a film crew's are not a game studio's), disclosed by
      the team or discerned from the corpus as the ontology evolves.
      Judgment rows point at theirs via HAS_DISCIPLINE, so a parked
      question can be routed to the kind of thinking it needs.
  "[Audience]":
    instance_of: Judgment
    doc: >-
      Who should weigh a thing when its moment arrives — a role or
      group a judgment is routed to, not a named person. The kernel
      declares only the class: every project's audiences are its own,
      disclosed by the team or discerned as the ontology evolves.
      Judgment rows point at theirs via HAS_AUDIENCE.
  # Kernel ceremony (the Judgment-vocabulary ceremony): Requirement, Opinion, and Theme enter the
  # engine — the first two by necessity (the engine's own machinery
  # mints them: tenets bind as Requirements; run-scoped judgment graphs
  # mint agent Opinions in any universe), Theme by the owner's
  # many-projects prediction (every project has design intent; the
  # kernel is where "Philosophy" stops being reinvented).
  "[Requirement]":
    instance_of: Judgment
    doc: >-
      A binding constraint the work must satisfy, held by someone — an
      individual or a group/org — and checkable where its wording
      allows. Requirements outrank preference: a dispute between taste
      and a Requirement resolves for the Requirement, and a dispute
      about whether work satisfies one resolves at a gate. Supersession
      is expected, as with any ruling.
  "[Opinion]":
    instance_of: Judgment
    doc: >-
      A stance held with stated confidence, not yet ruled. Agents mint
      Opinions during runs (mapping choices, judgment calls,
      classifications); people hold them too. An Opinion carries its
      holder and its confidence, is preserved rather than averaged,
      and binds nothing until ratified — ratification promotes its
      content into a Decision carrying the ratifier's authority.
  Theme:
    instance_of: Concept
    doc: >-
      A design message the project weaves through everything it does.
      Themes are not rules and not flavor: they are intent, stated in
      the owner's words, and every generated artifact is expected to
      honor them. The kernel declares only the class: each project's
      themes are its own ("orthogonality above all" is one corpus's;
      a storybook's moral is another's).
  '[Schema Layer]':
    doc: >-
      A stratum of this graph's own schema. Every graph carries at least
      two — the Metaontology (the engine's kernel, rank 0, loaded
      beneath) and the Ontology (this graph's domain vocabulary, rank 1,
      layered on top) — and every schema citizen DECLARED_IN exactly one.
      The interrogation path for a fresh connection: ask the Metaontology
      (what engine family), then the Ontology (what domain), then dig.
      Future strata (cross-graph stacks, overlays) arrive as instances —
      the concept is engine-owned; customers interrogate, never edit.

  "[Artifact]":
    instance_of: Provenance
    doc: >-
      The thing a person hands over — a document, an image, a recording,
      a model, a link, a physical object — as canon knows it. Identity is
      its name, a stable handle; WHERE it is lives on [Artifact Location]
      rows behind LOCATED_AT, so moving a file never renames a citizen.
      It carries the whole-file fingerprint and medium the gate derived
      when a location resolved, its grade (KNOWN_AT Completeness as
      CONTENT HELD: Cited — name and location only; Attested — a
      description and its DEPICTS facts confirmed at the gate;
      Transcribed — region-grain receipts), and `superseded_at` — the
      sequence at which it stopped being an intake ruler, read by the
      census as information, never a defect — with SUPERSEDES from a
      newer version to the one it replaces. DEPICTS names its objective
      contents; an [Interpretation] says what it stands for. Bracketed:
      a designer's world has artifacts of its own.
  "[Artifact Location]":
    instance_of: Provenance
    subtypes: ["[File Location]"]
    doc: >-
      Where an artifact can be got: `scheme` (file, https, a tool's
      own, physical, …), `address` (free text the scheme reads), and
      `primary` (true on exactly one of an artifact's locations).
      VERIFICATION is this row's own fact — `verified_fingerprint`,
      `verified_at_sequence`, `size` — written by the gate when the
      engine or a bound [Resolver] resolved it, read by the receipts
      sweep, never folded into the artifact's grade: a physical painting
      can be Attested with no verification, a verified file can rest at
      Cited. Kinds are a seam, not an enumeration: [File Location] is
      the kernel's; a tool or project knowledge base declares its own
      kind as a SUBTYPE_OF this one through the taxonomy ceremony, and
      an untyped location uses the base alone. Machinery — hence
      bracketed.
  "[File Location]":
    instance_of: Provenance
    doc: >-
      An [Artifact Location] the engine resolves natively: `address` is
      a path under the knowledge base, read at the gate — fingerprint
      and medium derived onto the artifact, verification written here.
      A file that cannot be read, or a declared fingerprint the bytes do
      not match, refuses by name.
  "[Interpretation]":
    instance_of: Judgment
    doc: >-
      What an artifact stands for to a world, per intent — the
      subjective layer over DEPICTS' objective one; many per artifact,
      each citing any subset (or none) of the depicted things. Carries
      `intent` in the world's own words (intention belongs to the
      person, so it is a property, never a citizen), who and when; one
      ABOUT edge to its artifact, INTERPRETED_AS to what it stands for,
      DRAWS_ON to the depicted citizens it uses. A ruled reading of the
      meaning seam, beside the four rulings of the intake seam.
      Placement ("the illustration in chapter eleven") is composition,
      deliberately not this; [Intended Use] is reserved for it.
      Bracketed: a story may have interpretations of its own.
  "[Resolver]":
    instance_of: Provenance
    doc: >-
      How this knowledge base opens a kind of location: named for its
      scheme, bound by OPENS_WITH to the procedure that opens it — a
      local [Procedure], or a [Citizen Bookmark] into the tool knowledge base
      that owns the how — for one location kind. The executable binding
      (a project path, a command, credentials) is settings, never canon.
      Vocabulary at this rung: the verb that runs a resolver awaits the
      first tool knowledge base.

facets:
  # The common library: natively supported, used by MANY (not all) projects.
  # A project activates a facet by referencing it (concept: lists, ordered:).
  # Project-specific facets go in the project file's own facets: section.
  '[Segment Scheme]': >-
    A corpus's structure vocabulary ("Story Units", in the roadmap's
    language): an ordered ladder of segment types (coarse to fine) whose
    instances nest via PART_OF chains. Membership test — a segment type
    subdivides an EXTENDED MEDIUM (text, time, space, film, an
    execution) into ADDRESSABLE PARTS, readable both as containers
    ("Round 3", "frame 1042") and as counts ("lasts 3 rounds", "takes 4
    T-cycles"). NOT admitted: units of measure as denominations — ruler
    refinement (1000 g = 1 kg) and scalar quantities (weight,
    encumbrance) have no addressable instances and stay plain property
    values. Schemes are DEDUCED from a corpus's artifacts by recon and
    ratified at a plan gate — never engine-hardcoded — and a corpus may
    carry several parallel schemes (organizational, temporal,
    narrative). A project declares a scheme as a facet instance of
    Segment Scheme with an ordered values: ladder naming its segment
    types (declared as sibling facet entries); segment types with
    existing citizen populations bind to their label via that label's
    concept: list. A segment type declared `recursive: true` may contain
    any number of children of its own type (a Section holds
    sub-Sections). A scheme declared `temporal: true` is a time axis:
    its units are when-vocabulary, and claims may later be scoped to
    them ("true during this Round") — the scoping machinery arrives with
    the contradiction work; the declaration is honest now.
  Ordered: >-
    Values form a ladder: rank property + bidirectional PRECEDES/FOLLOWS
    edges. Applied automatically by `ordered: true` on a label.
  Exclusive: >-
    A holder has one-and-only-one value at a time (a traffic light shows
    exactly one of red, amber, green). Value-spaces whose members stack are
    deliberately NOT Exclusive. Declared semantics today; enforcement
    machinery may arrive with live-state work.
  Stateful: >-
    Rule-governed transitions exist between values, carried as
    TRANSITIONS_TO {trigger} edges from an approved transition table.
  Parameterized: >-
    The concept's value-space contains templates with variables
    ("Noun of Verbing"-style entries); concrete instances bind each
    variable via FULFILLS {variable, value} edges, one per variable.
  Completeness:
    ordered: true
    values: [Cited, Attested, Transcribed]
    doc: >-
      How much of a procedure — or of an artifact — the graph holds — coverage, not accuracy
      (accuracy is guarded by the approved_hash tripwire and derivation
      answer-keys) and not trust. Procedures point at their level via
      KNOWN_AT; the per-section *_closed markers are the same dimension
      at section granularity. The two-axis test decides the level: does
      an agent need the inner workings, and do we own the source?
  Cited:
    instance_of: Completeness
    doc: >-
      The graph holds that the procedure exists: a name, a link to where
      it lives (SPECIFIED_IN), a description. Every signature section is
      open — a missing edge means unknown, not known-absent. The right
      level for procedures we neither own nor need the innards of (a
      DCC tool's million operations).
  Attested:
    instance_of: Completeness
    doc: >-
      The graph holds the procedure's surface: an asserted signature
      (inputs, possible outcomes, reads/consults/mutates with per-section
      open/closed markers) vouched against a prose body via the
      approved_hash tripwire — validation warns when the approved source
      drifts. The signature is asserted, so it can lie; the hash catches
      staleness, not wrongness.
  Transcribed:
    instance_of: Completeness
    doc: >-
      The graph holds the whole procedure: the approved program is lifted
      to Step chains and the signature (READS, MUTATES, CALLS, outcomes
      via HAS_POSSIBLE_OUTCOME) is DERIVED from the body — closed by
      construction, unable to drift. Derived signature edges land on
      value citizens; concept-level observations (a branch's subject, a
      computation's sources) land on the concept's Archetype. Reference
      resolution goes through the term index — canonical names, aliases,
      surface forms, and plural variants all resolve; unresolved terms
      are worklist findings, never silent. Where an approved fact table
      overlaps the
      program, a derivation test keeps them in agreement. CAVEAT:
      derived closure is relative to the graph's VOCABULARY — complete
      over what the graph can name, silent about what it cannot. The
      unresolved-term report lists what the source names that the graph
      does not; each entry is an asterisk on the closure claim.
