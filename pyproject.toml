# Ghostwheel: a project-agnostic, Neo4j-backed knowledge-graph engine.
#
# The distribution is named `ghostwheel`, but the importable package keeps
# its original name, `graph` — a deliberate choice, so a knowledge base that
# consumes the engine imports `graph`/runs `python -m graph` with zero churn.
# (See README, "Why the package is called `graph`".)
[project]
name = "ghostwheel"
version = "0.15.0"
description = "Ghostwheel: a project-agnostic knowledge-graph engine — two-layer ontology, deterministic export/restore, reviewed delta rounds with a diff gate, a chained event log, and visibility lenses."
requires-python = ">=3.11"
dependencies = ["pyyaml", "neo4j"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ghostwheel = "graph.__main__:main"

[tool.setuptools]
packages = ["graph", "graph.grammars"]

[tool.setuptools.package-data]
# The engine carries its own kernel seed: an installed engine can seed
# a new knowledge base without any checkout of this repo. It also
# carries its skills and design records, so a consuming knowledge base
# vendors them FROM the installed package — one living copy, here.
graph = ["metaontology.yaml", "engine_docs/design/*.md",
         "engine_docs/skills/*/SKILL.md"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
